<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="background">
     
            <div class="row border border-black border-3 p-3 m-5 bg-light">
                <div class="col-12 text-center">
                    <h1>Number Guessing Game</h1>
                    
                    <h2>
                        <img src="./images/arrow-right-circle.svg" alt="guess" class="img-fluid" id="arrow1" onclick="Istruzioni()">
                        <img src="./images/arrow-down-circle-fill.svg" alt="guess" class="img-fluid d-none" id="arrow2" onclick="Istruzioni()">
                    Istruzioni</h2>
                    <p class="fst-italic d-none" id="istruzioni">Il computer genera un numero casuale compreso tra 0 e 100. Tu dovrai indovinarlo. Hai a disposizione 7 tentativi.</p>

                    <button type="button" class="btn btn-primary" onclick="gioca()">Gioca</button>
                </div>
            </div>

             <div class="row p-3 m-5 bg-light d-none" id="game">
                <div class="col-12 text-center">
                   <form action="">
                    <input type="number" name="" id="input" placeholder="numero" class="rounded p-2 m-2">
                    <button type="button" class="btn btn-info" onclick="Indovina()">Check</button>
                   </form>

                   <h1 id="risultato"></h1>
                </div>
                <div class="col-md-4 col-sm-12 text-center">
                    <h2>Tentativi rimasti</h2>
                     <img src="./images/joystick.svg" alt="guess" class="img-fluid ">
                     <p id="tentativi" class="p-3">7</p>
                </div>
                <div class="col-md-4 col-sm-12 text-center">
                    <h2>Suggerimenti</h2>
                     <img src="./images/info-square.svg" alt="guess" class="img-fluid ">
                     <p id="suggerimenti" class="text-info p-3"></p>
                </div>
                <div class="col-md-4 col-sm-12 text-center">
                    <h2>Numeri inseriti </h2>
                    <img src="./images/pencil-square.svg" alt="guess" class="img-fluid ">
                    <p id="NumeriInseriti" class="p-3"></p>
                </div>
            </div>


       <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
       <script src="./js/script.js"></script>
</body>
</html>
